server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /web/assets/ {
        alias /usr/share/nginx/html/assets/;
    }


    # location = /web/ {
    #     try_files /index.html =404;
    # }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
